<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Photo Selector Linux (org.photoselector.Linux)
    GNOME HIG App Icon — "Obsidian Darkroom & Optical Cobalt" Studio Emblem
    Combines a tactile GNOME squircle darkroom chassis, a 6-blade precision iris
    aperture barrel, an Optical Cobalt/Cyan lens ring, and an Emerald Keeper focus reticle.
  -->
  <defs>
    <!-- GNOME HIG Squircle Obsidian Chassis Gradient -->
    <linearGradient id="chassisGrad" x1="64" y1="32" x2="448" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#232530" />
      <stop offset="50%" stop-color="#16171D" />
      <stop offset="100%" stop-color="#0E0F14" />
    </linearGradient>

    <!-- Bottom 3D GNOME HIG Ledge Shadow/Bevel -->
    <linearGradient id="chassisRimGrad" x1="256" y1="36" x2="256" y2="476" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A4E62" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#2E303E" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#090A0D" stop-opacity="0.95" />
    </linearGradient>

    <!-- Outer Anodized Barrel Gradient -->
    <linearGradient id="barrelGrad" x1="100" y1="100" x2="412" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2A2D3A" />
      <stop offset="100%" stop-color="#121318" />
    </linearGradient>

    <!-- Optical Cobalt to Cyan Signature Ring Gradient -->
    <linearGradient id="opticalCobaltGrad" x1="86" y1="86" x2="426" y2="426" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3584E4" />
      <stop offset="55%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Secondary Emerald Keeper Accent Gradient -->
    <linearGradient id="emeraldKeeperGrad" x1="160" y1="160" x2="352" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3DD68C" />
      <stop offset="100%" stop-color="#2EC27E" />
    </linearGradient>

    <!-- Deep Optical Glass Element Radial Gradient -->
    <radialGradient id="glassCoreGrad" cx="256" cy="256" r="148" fx="210" fy="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F141C" />
      <stop offset="100%" stop-color="#080A0F" />
    </radialGradient>

    <!-- Aperture Blade Slate Gradient A -->
    <linearGradient id="bladeGradA" x1="140" y1="140" x2="360" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#252834" />
      <stop offset="100%" stop-color="#171922" />
    </linearGradient>

    <!-- Aperture Blade Slate Gradient B -->
    <linearGradient id="bladeGradB" x1="360" y1="140" x2="140" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#20232E" />
      <stop offset="100%" stop-color="#13151C" />
    </linearGradient>

    <!-- Multi-Coated Lens Flare Gradient -->
    <linearGradient id="lensCoatGrad" x1="150" y1="130" x2="330" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.32" />
      <stop offset="45%" stop-color="#34D399" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="cobaltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Clip Path for Inner Aperture Assembly -->
    <clipPath id="apertureClip">
      <circle cx="256" cy="256" r="142" />
    </clipPath>
  </defs>

  <!-- 1. GNOME HIG Tactile Squircle Base Shadow & Extrusion Ledge -->
  <rect x="36" y="48" width="440" height="436" rx="104" fill="#07080B" />
  <rect x="36" y="36" width="440" height="436" rx="104" fill="url(#chassisGrad)" stroke="url(#chassisRimGrad)" stroke-width="4" />

  <!-- Top-left & Top-right subtle studio corner screws / calibration ticks -->
  <circle cx="88" cy="88" r="6" fill="#2A2D3A" stroke="#3A3A42" stroke-width="1.5" />
  <circle cx="424" cy="88" r="6" fill="#2A2D3A" stroke="#3A3A42" stroke-width="1.5" />
  <circle cx="88" cy="420" r="6" fill="#2A2D3A" stroke="#3A3A42" stroke-width="1.5" />
  <circle cx="424" cy="420" r="6" fill="#2A2D3A" stroke="#3A3A42" stroke-width="1.5" />

  <!-- 2. Outer Camera Lens Barrel Housing -->
  <circle cx="256" cy="254" r="190" fill="#0B0C10" />
  <circle cx="256" cy="254" r="184" fill="url(#barrelGrad)" stroke="#3A3A42" stroke-width="3" />

  <!-- Precision Focal Scale Tick Marks around outer barrel -->
  <g stroke="#525668" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="256" y1="78" x2="256" y2="90" stroke="#3584E4" stroke-width="4" />
    <line x1="256" y1="418" x2="256" y2="430" />
    <line x1="80" y1="254" x2="92" y2="254" />
    <line x1="420" y1="254" x2="432" y2="254" />
    <line x1="132" y1="130" x2="141" y2="139" />
    <line x1="380" y1="130" x2="371" y2="139" stroke="#2EC27E" stroke-width="3.5" />
    <line x1="132" y1="378" x2="141" y2="369" />
    <line x1="380" y1="378" x2="371" y2="369" />
  </g>

  <!-- 3. Signature Optical Cobalt Ring (#3584E4 -> #06B6D4) -->
  <circle cx="256" cy="254" r="156" fill="#101218" stroke="url(#opticalCobaltGrad)" stroke-width="9" filter="url(#cobaltGlow)" />

  <!-- 4. Inner Optical Element & 6-Blade Iris Aperture -->
  <g clip-path="url(#apertureClip)">
    <circle cx="256" cy="256" r="142" fill="url(#glassCoreGrad)" />

    <!-- 6 Interlocking Iris Aperture Blades forming a central hexagonal opening -->
    <g stroke="#3A3F52" stroke-width="2" stroke-linejoin="round">
      <!-- Blade 1 (Top) -->
      <polygon points="110,130 330,110 296,188 186,188" fill="url(#bladeGradA)" />
      <!-- Blade 2 (Top-Right) -->
      <polygon points="330,110 410,270 336,256 296,188" fill="url(#bladeGradB)" />
      <!-- Blade 3 (Bottom-Right) -->
      <polygon points="410,270 300,405 296,324 336,256" fill="url(#bladeGradA)" />
      <!-- Blade 4 (Bottom) -->
      <polygon points="300,405 170,400 216,324 296,324" fill="url(#bladeGradB)" />
      <!-- Blade 5 (Bottom-Left) -->
      <polygon points="170,400 100,240 176,256 216,324" fill="url(#bladeGradA)" />
      <!-- Blade 6 (Top-Left) -->
      <polygon points="100,240 190,110 216,188 176,256" fill="url(#bladeGradB)" />
    </g>

    <!-- Central Hexagonal Aperture Opening Rim -->
    <polygon points="216,188 296,188 336,256 296,324 216,324 176,256"
             fill="#0B0E14"
             stroke="#3584E4"
             stroke-width="2.5"
             stroke-linejoin="round" />

    <!-- Multi-Coated Optical Glass Reflection -->
    <ellipse cx="220" cy="195" rx="95" ry="62" transform="rotate(-24 220 195)" fill="url(#lensCoatGrad)" />
    <circle cx="196" cy="186" r="14" fill="#FFFFFF" opacity="0.18" />
    <circle cx="218" cy="206" r="6" fill="#60A5FA" opacity="0.28" />
  </g>

  <!-- 5. Central Focus Reticle Brackets (Optical Cobalt #3584E4) -->
  <g stroke="#3584E4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-Left Focus Bracket -->
    <path d="M 206,226 L 206,210 L 222,210" />
    <!-- Top-Right Focus Bracket -->
    <path d="M 290,210 L 306,210 L 306,226" />
    <!-- Bottom-Left Focus Bracket -->
    <path d="M 206,286 L 206,302 L 222,302" />
    <!-- Bottom-Right Focus Bracket -->
    <path d="M 290,302 L 306,302 L 306,286" />
  </g>

  <!-- 6. Central Emerald Keeper Checkmark / Selection Crest (#2EC27E) -->
  <path d="M 228,258 L 248,278 L 288,236"
        stroke="url(#emeraldKeeperGrad)"
        stroke-width="12"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#cobaltGlow)" />

  <!-- 7. Corner Studio Badge Pill (3-Up Triplet Indicator Dot Cluster) -->
  <g transform="translate(226, 444)">
    <rect x="0" y="0" width="60" height="14" rx="7" fill="#1C1C20" stroke="#3A3A42" stroke-width="1.5" />
    <circle cx="16" cy="7" r="3" fill="#8E92A4" />
    <circle cx="30" cy="7" r="4" fill="#3584E4" />
    <circle cx="44" cy="7" r="3" fill="#8E92A4" />
  </g>
</svg>
